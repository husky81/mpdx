<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예산</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #444;
      padding: 6px 10px;
      font-size: 14px;
      vertical-align: top;
    }
    th {
      background: #f2f2f2;
    }
    td:nth-child(n+1) {
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>예산</h1>
  <table>
<thead>
<tr>
<th colspan="2">구분</th>
<th>평가항목</th>
<th>평가방법</th>
</tr>
<tr>
<th>공통</th>
<th>평가항목</th>
<th>정량목표(%)</th>
</tr>
</thead>
<tbody>
</tbody></table>
</body>
</html>
