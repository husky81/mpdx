<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>연구개발비 예산 집행 현황</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #444;
      padding: 6px 10px;
      font-size: 14px;
      vertical-align: top;
    }
    th {
      background: #f2f2f2;
    }
    td:nth-child(n+1) {
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>연구개발비 예산 집행 현황</h1>
  <table>
<thead>
<tr>
<th colspan="6">비목</th>
<th>세목</th>
<th>금액</th>
<th>비고</th>
</tr>
<tr>
<th>직접비</th>
<th>간접비</th>
<th>연구개발비 총액</th>
<th>세목</th>
<th>계획금액</th>
<th>집행액</th>
<th>잔액</th>
<th>비고</th>
</tr>
</thead>
<tbody>
</tbody></table>
</body>
</html>
